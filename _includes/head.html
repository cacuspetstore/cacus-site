<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="icon" href="/assets/cacus-symbol.png" type="image/png">
<link rel="alternate" type="application/rss+xml" title="Blog da Cacus Pet" href="/blog/feed.xml">
{% seo %}
<style>
:root{--bg:#f6faf9;--surface:#fff;--ink:#12302d;--muted:#557370;--line:#d5e6e3;--teal:#0f8b80;--teal-deep:#0b5f58;--teal-soft:#e2f3f0;--coral:#ef6f5c;--coral-soft:#fde9e5;--on-accent:#fff;--f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 var(--f-body)}
a{color:var(--teal-deep)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.35rem var(--f-display)}
.brand img{width:40px;height:40px}
.nav{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:.7em 1.15em;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid transparent;cursor:pointer;font-size:.95rem;font-family:var(--f-body)}
.btn-solid{background:var(--teal);color:var(--on-accent)}.btn-solid:hover{background:var(--teal-deep)}
.btn-line{border-color:var(--line);color:var(--ink);background:var(--surface)}.btn-line:hover{border-color:var(--teal)}
.blog-hero{padding:32px 0 8px}.blog-hero h1{font:800 clamp(2rem,5vw,3rem)/1.1 var(--f-display);margin:0 0 8px}.blog-hero p{color:var(--muted);margin:0;max-width:60ch}
.eyebrow{display:inline-block;font:600 .8rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep);background:var(--teal-soft);padding:.45em .8em;border-radius:999px}
.eyebrow.coral{color:#b3412f;background:var(--coral-soft)}
.posts{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding:24px 0 48px;list-style:none;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.card h2{font:700 1.3rem/1.25 var(--f-display);margin:0}.card h2 a{color:var(--ink);text-decoration:none}.card h2 a:hover{color:var(--teal-deep)}
.card p{margin:0;color:var(--muted)}.meta{font-size:.85rem;color:var(--muted)}
article.post{max-width:72ch;margin:0 auto;padding:24px 0 48px}
article.post h1{font:800 clamp(1.9rem,4.5vw,2.6rem)/1.12 var(--f-display);margin:12px 0 8px}
article.post h2{font:700 1.5rem/1.25 var(--f-display);margin:1.6em 0 .5em}article.post h3{font:700 1.2rem/1.3 var(--f-display);margin:1.4em 0 .4em}
article.post img{max-width:100%;border-radius:16px}article.post blockquote{margin:1.2em 0;padding:.2em 1em;border-left:4px solid var(--teal);color:var(--muted)}
article.post ul,article.post ol{padding-left:1.3em}article.post code{background:var(--teal-soft);padding:.1em .35em;border-radius:6px;font-size:.95em}
.aviso{margin:2em 0 0;padding:16px 18px;border-radius:16px;background:var(--coral-soft);color:#6b2a1e;font-size:.95rem}
.cta{margin:2.5em 0 0;padding:24px;border-radius:22px;background:var(--teal-soft);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.cta strong{font:700 1.15rem var(--f-display)}
footer{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;padding:28px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer a{color:var(--muted)}footer .legal{width:100%;font-size:.8rem}
</style>
